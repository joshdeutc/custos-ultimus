name: Release APKs (Time-Locked)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    # Cet environnement impose le Wait Timer configuré dans les réglages GitHub
    environment: CustosUltimus

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode and Verify Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing or empty in environment CustosUltimus"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > /tmp/release.jks
          if [ ! -s /tmp/release.jks ]; then
            echo "::error::Decoded /tmp/release.jks is empty"
            exit 1
          fi
          keytool -list -keystore /tmp/release.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null || {
            echo "::error::Failed to verify keystore or alias '$KEY_ALIAS' (check KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS in CustosUltimus)"
            exit 1
          }

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Sign Custos Ultimus & Guardian Release APKs
        env:
          RELEASE_KEYSTORE_FILE: /tmp/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :guardian:assembleRelease :app:assembleMeRelease --stacktrace

      - name: Clean up Keystore file
        if: always()
        run: rm -f /tmp/release.jks

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: custos-ultimus-release-apks
          path: '**/build/outputs/apk/**/*.apk'
          retention-days: 1

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/build/outputs/apk/**/*.apk'
          name: Custos Ultimus Release ${{ github.ref_name }}
          generate_release_notes: true

      - name: Prune older GitHub Releases (Single-Release Security Policy)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_tag="${{ github.ref_name }}"
          echo "Preserving active release tag: $current_tag"
          gh release list --limit 50 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$current_tag" ] && [[ "$tag" == v* ]]; then
              echo "Pruning older release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done
